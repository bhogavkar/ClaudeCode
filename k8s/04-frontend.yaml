apiVersion: apps/v1
kind: Deployment
metadata:
  name: pp-frontend
  namespace: planning-poker
  labels: { app: pp-frontend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: pp-frontend }
  template:
    metadata:
      labels: { app: pp-frontend }
    spec:
      containers:
        - name: frontend
          image: ghcr.io/your-org/planning-poker-frontend:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: '50m', memory: '64Mi' }
            limits: { cpu: '250m', memory: '128Mi' }
---
apiVersion: v1
kind: Service
metadata:
  name: pp-frontend
  namespace: planning-poker
spec:
  selector: { app: pp-frontend }
  ports:
    - port: 80
      targetPort: 80
