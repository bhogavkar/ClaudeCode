# Horizontal Pod Autoscaler for the API — scales to absorb 500+ concurrent users.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pp-backend-hpa
  namespace: planning-poker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pp-backend
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
