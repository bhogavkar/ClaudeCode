# Ingress routing. IMPORTANT: Socket.IO with >1 backend replica requires either
# sticky sessions (session affinity, below) or the Socket.IO Redis adapter so
# events fan out across pods. Sticky sessions are the simplest correct default.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pp-ingress
  namespace: planning-poker
  annotations:
    nginx.ingress.kubernetes.io/affinity: 'cookie'
    nginx.ingress.kubernetes.io/affinity-mode: 'persistent'
    nginx.ingress.kubernetes.io/session-cookie-name: 'pp_affinity'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '3600'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '3600'
    cert-manager.io/cluster-issuer: 'letsencrypt-prod'
spec:
  ingressClassName: nginx
  tls:
    - hosts: ['poker.example.com']
      secretName: pp-tls
  rules:
    - host: poker.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: pp-backend
                port: { number: 4000 }
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: pp-backend
                port: { number: 4000 }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pp-frontend
                port: { number: 80 }
