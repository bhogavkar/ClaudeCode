apiVersion: v1
kind: ConfigMap
metadata:
  name: pp-config
  namespace: planning-poker
data:
  NODE_ENV: 'production'
  PORT: '4000'
  CORS_ORIGIN: 'https://poker.example.com'
  RATE_LIMIT_WINDOW_MS: '900000'
  RATE_LIMIT_MAX: '600'
---
# NOTE: These are placeholders. In production create the Secret out-of-band, e.g.
#   kubectl -n planning-poker create secret generic pp-secrets \
#     --from-literal=DATABASE_URL=... \
#     --from-literal=JWT_ACCESS_SECRET=$(openssl rand -hex 48) \
#     --from-literal=JWT_REFRESH_SECRET=$(openssl rand -hex 48)
# and manage it with a sealed-secrets / external-secrets controller.
apiVersion: v1
kind: Secret
metadata:
  name: pp-secrets
  namespace: planning-poker
type: Opaque
stringData:
  DATABASE_URL: 'postgresql://poker:poker@pp-postgres:5432/planning_poker?schema=public'
  JWT_ACCESS_SECRET: 'replace-with-openssl-rand-hex-48'
  JWT_REFRESH_SECRET: 'replace-with-openssl-rand-hex-48'
  POSTGRES_PASSWORD: 'poker'
