<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flow Diagram Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================================
   (A) APPLICATION SHELL THEME — deep blue-slate IDE aesthetic + amber accent
   ========================================================================== */
:root{
  /* surfaces */
  --bg:#0d1522; --bg-panel:#111a29; --bg-elev:#15203250;
  --surface:#18233a; --surface-2:#1e2c45;
  /* lines */
  --border:#243349; --border-strong:#33455f;
  /* text */
  --text:#e6edf6; --muted:#8da2bd; --faint:#5d6f87;
  /* accent + status */
  --accent:#f5a623; --accent-hover:#ffb84d; --accent-soft:rgba(245,166,35,0.12);
  --success:#34d399; --danger:#ef4444; --info:#7c6cf0; --warning:#f5a623;
  /* effects */
  --shadow:0 10px 30px rgba(0,0,0,0.45); --shadow-sm:0 2px 8px rgba(0,0,0,0.35);
  --radius:10px; --radius-sm:6px;
  /* fonts */
  --font-ui:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-mono:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace;
  /* diagram canvas (overridden live by Theme module) */
  --canvas-bg:#ffffff; --canvas-grid:#d7dee8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font-ui); background:var(--bg); color:var(--text);
  font-size:13px; overflow:hidden; -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;color:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:#44597a}

/* ---- App grid layout ---- */
#app{display:grid;grid-template-rows:auto 1fr auto;height:100vh;width:100vw}
#toolbar{
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  background:var(--bg-panel);border-bottom:1px solid var(--border);
  padding:6px 10px;z-index:30;
}
.tb-group{display:flex;align-items:center;gap:3px;padding:0 6px}
.tb-group + .tb-group{border-left:1px solid var(--border)}
.tb-title{font-weight:700;font-size:14px;color:var(--accent);padding:0 10px 0 2px;letter-spacing:.2px;white-space:nowrap}
.tb-title span{color:var(--text)}
.btn{
  display:inline-flex;align-items:center;gap:5px;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:5px 8px;color:var(--text);font-size:12px;line-height:1;
  transition:background .12s,border-color .12s;white-space:nowrap;
}
.btn:hover{background:var(--surface-2);border-color:var(--border-strong)}
.btn:active{transform:translateY(1px)}
.btn.icon{padding:6px;min-width:30px;justify-content:center}
.btn.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-hover)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn svg{width:15px;height:15px;display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.btn.primary{background:var(--accent);color:#1a1205;border-color:var(--accent);font-weight:600}
.btn.primary:hover{background:var(--accent-hover)}
.zoom-input{width:52px;text-align:center;background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:var(--radius-sm);padding:5px 4px;font-size:12px}
select.tb-select{background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:var(--radius-sm);padding:5px 6px;font-size:12px}
.spacer{flex:1}

/* dropdown menu */
.menu-wrap{position:relative}
.menu{
  position:absolute;top:calc(100% + 4px);left:0;background:var(--surface);
  border:1px solid var(--border-strong);border-radius:var(--radius-sm);
  box-shadow:var(--shadow);padding:5px;min-width:190px;z-index:60;display:none;
}
.menu.open{display:block}
.menu button{display:flex;width:100%;align-items:center;gap:8px;background:none;border:none;
  padding:7px 9px;border-radius:5px;font-size:12px;text-align:left}
.menu button:hover{background:var(--surface-2)}
.menu .sep{height:1px;background:var(--border);margin:4px 2px}
.menu .kbd{margin-left:auto;color:var(--faint);font-family:var(--font-mono);font-size:10px}

/* ---- Middle row ---- */
#middle{display:grid;grid-template-columns:auto 1fr auto;min-height:0;position:relative}
.panel{background:var(--bg-panel);display:flex;flex-direction:column;min-height:0}
#left-panel{border-right:1px solid var(--border);width:230px}
#right-panel{border-left:1px solid var(--border);width:288px}
.panel.collapsed{width:0;overflow:hidden;border:none}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-bottom:1px solid var(--border);font-weight:600;font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.panel-body{overflow-y:auto;overflow-x:hidden;flex:1;min-height:0}

/* palette */
.search-box{margin:9px 10px;display:block}
.search-box input{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:var(--radius-sm);padding:7px 9px;font-size:12px}
.search-box input:focus{outline:none;border-color:var(--accent)}
.cat{border-bottom:1px solid var(--border)}
.cat-head{display:flex;align-items:center;gap:6px;padding:8px 12px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);cursor:pointer;user-select:none}
.cat-head .chev{transition:transform .15s;width:12px;height:12px}
.cat.closed .chev{transform:rotate(-90deg)}
.cat.closed .cat-items{display:none}
.cat-items{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:4px 10px 12px}
.shape-item{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 4px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);cursor:grab;transition:.12s;text-align:center}
.shape-item:hover{background:var(--surface-2);border-color:var(--accent)}
.shape-item svg{width:34px;height:26px;display:block}
.shape-item span{font-size:10px;color:var(--muted);line-height:1.1}
.shape-item.full{grid-column:1/-1;flex-direction:row;justify-content:flex-start;gap:9px;text-align:left}
.shape-item.full svg{width:30px;height:22px;flex:none}
.shape-item.full span{font-size:11px}

/* canvas */
#canvas-wrap{position:relative;overflow:hidden;background:var(--canvas-bg);min-width:0}
#svg{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:default;background:var(--canvas-bg)}
#svg.panning{cursor:grabbing}
#svg.tool-hand{cursor:grab}
#svg.tool-connector{cursor:crosshair}
.node-text{user-select:none}
.inline-editor{position:absolute;z-index:50;background:#fff;color:#111;border:2px solid var(--accent);border-radius:6px;box-shadow:var(--shadow);font-family:var(--font-ui);padding:6px 8px;resize:none;outline:none;line-height:1.3}

/* inspector */
.insp-section{border-bottom:1px solid var(--border);padding:10px 12px}
.insp-section h4{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--accent);margin-bottom:9px;display:flex;align-items:center;gap:6px}
.field{margin-bottom:9px}
.field:last-child{margin-bottom:0}
.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
.field input[type=text],.field input[type=number],.field select,.field textarea{
  width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);
  border-radius:var(--radius-sm);padding:6px 8px;font-size:12px;
}
.field textarea{resize:vertical;min-height:54px;font-family:var(--font-mono);line-height:1.4}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent)}
.field-row{display:flex;gap:8px}
.field-row .field{flex:1;margin-bottom:9px}
.inline-flds{display:flex;gap:8px;align-items:center}
.swatch-row{display:flex;align-items:center;gap:6px}
input[type=color]{width:34px;height:30px;padding:0;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);cursor:pointer}
input[type=range]{width:100%;accent-color:var(--accent)}
.chk{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text);cursor:pointer;margin-bottom:8px}
.chk input{width:15px;height:15px;accent-color:var(--accent)}
.seg{display:flex;border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden}
.seg button{flex:1;background:var(--surface);border:none;border-right:1px solid var(--border);padding:6px 4px;font-size:11px;color:var(--muted)}
.seg button:last-child{border-right:none}
.seg button.active{background:var(--accent-soft);color:var(--accent-hover)}
.empty-hint{padding:24px 16px;color:var(--faint);font-size:12px;text-align:center;line-height:1.5}
.preset-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.preset-chip{display:flex;align-items:center;gap:6px;padding:6px 7px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:11px;cursor:pointer}
.preset-chip:hover{border-color:var(--accent)}
.preset-chip .dot{width:11px;height:11px;border-radius:3px;flex:none}
.icon-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;max-height:150px;overflow-y:auto;padding:2px}
.icon-grid button{aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:var(--surface);border:1px solid var(--border);border-radius:5px;padding:5px}
.icon-grid button svg{width:100%;height:100%}
.icon-grid button.sel{border-color:var(--accent);background:var(--accent-soft)}

/* status bar */
#statusbar{display:flex;align-items:center;gap:14px;background:var(--bg-panel);border-top:1px solid var(--border);padding:5px 12px;font-size:11px;color:var(--muted);z-index:20;flex-wrap:wrap}
#statusbar .si{display:flex;align-items:center;gap:5px}
#statusbar .dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
#statusbar .dot.on{background:var(--success)}
#legend-strip{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-left:auto}
.lg-item{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted)}
.lg-sw{width:18px;height:12px;border-radius:3px;border:1.5px solid #999;background:#fff}
.lg-line{width:22px;height:0;border-top:2.5px solid #999}

/* toasts */
#toasts{position:fixed;bottom:46px;right:16px;display:flex;flex-direction:column;gap:8px;z-index:200}
.toast{background:var(--surface);border:1px solid var(--border-strong);border-left:3px solid var(--accent);border-radius:var(--radius-sm);padding:10px 14px;box-shadow:var(--shadow);font-size:12px;max-width:320px;animation:slidein .2s ease}
.toast.success{border-left-color:var(--success)} .toast.error{border-left-color:var(--danger)} .toast.info{border-left-color:var(--info)}
@keyframes slidein{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}

/* modal / overlay */
.overlay{position:fixed;inset:0;background:rgba(5,9,16,.62);display:none;align-items:center;justify-content:center;z-index:300}
.overlay.open{display:flex}
.modal{background:var(--bg-panel);border:1px solid var(--border-strong);border-radius:var(--radius);box-shadow:var(--shadow);max-width:760px;width:92%;max-height:86vh;overflow:auto}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg-panel)}
.modal-head h2{font-size:16px}
.modal-body{padding:18px}
.modal-body h3{font-size:13px;color:var(--accent);margin:14px 0 7px}
.modal-body h3:first-child{margin-top:0}
.kbd-table{width:100%;border-collapse:collapse;font-size:12px}
.kbd-table td{padding:5px 8px;border-bottom:1px solid var(--border)}
.kbd-table td:last-child{text-align:right}
.kbd-table .kbd{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:2px 6px;font-family:var(--font-mono);font-size:11px}
.tpl-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tpl-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;cursor:pointer;transition:.12s}
.tpl-card:hover{border-color:var(--accent);background:var(--surface-2)}
.tpl-card h4{font-size:13px;margin-bottom:5px}
.tpl-card p{font-size:11px;color:var(--muted);line-height:1.4}
.close-x{background:none;border:none;font-size:20px;color:var(--muted);padding:2px 8px}
.close-x:hover{color:var(--text)}
.radio-row{display:flex;gap:14px;margin:8px 0}
.radio-row label{display:flex;align-items:center;gap:6px;font-size:12px}

/* context menu */
#ctxmenu{position:fixed;z-index:400;background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--radius-sm);box-shadow:var(--shadow);padding:5px;min-width:170px;display:none}
#ctxmenu button{display:flex;width:100%;align-items:center;gap:8px;background:none;border:none;padding:7px 10px;border-radius:5px;font-size:12px;text-align:left}
#ctxmenu button:hover{background:var(--surface-2)}
#ctxmenu .sep{height:1px;background:var(--border);margin:4px 2px}
.collapse-tab{position:absolute;top:50%;width:14px;height:46px;background:var(--bg-panel);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:25;color:var(--muted);font-size:10px}
@media print{ body *{visibility:hidden} #print-area,#print-area *{visibility:visible} #print-area{position:absolute;inset:0} }
</style>
</head>
<body>
<div id="app">
  <!-- ===================== TOP TOOLBAR ===================== -->
  <div id="toolbar">
    <div class="tb-title">◆ Flow<span>Forge</span></div>

    <div class="tb-group" id="g-file">
      <button class="btn" data-act="new" title="New diagram"><svg viewBox="0 0 24 24"><path d="M6 2h9l5 5v15H6z"/><path d="M15 2v5h5"/></svg>New</button>
      <button class="btn" data-act="open" title="Open diagram JSON, or import an SVG/PNG/JPG image (Ctrl/Cmd+O)"><svg viewBox="0 0 24 24"><path d="M3 7h6l2 2h10v10H3z"/></svg>Open</button>
      <button class="btn" data-act="save" title="Save JSON (Ctrl/Cmd+S)"><svg viewBox="0 0 24 24"><path d="M5 3h12l4 4v14H5z"/><path d="M8 3v6h8V3M8 21v-7h8v7"/></svg>Save</button>
      <div class="menu-wrap">
        <button class="btn" data-menu="export" title="Export">Export ▾</button>
        <div class="menu" id="menu-export">
          <button data-act="export-png">Export PNG (HD)…</button>
          <button data-act="export-svg">Export SVG</button>
          <button data-act="export-pdf">Export PDF / Print</button>
          <button data-act="copy-img">Copy image to clipboard</button>
        </div>
      </div>
    </div>

    <div class="tb-group" id="g-edit">
      <button class="btn icon" data-act="undo" title="Undo (Ctrl/Cmd+Z)"><svg viewBox="0 0 24 24"><path d="M9 7L4 12l5 5"/><path d="M4 12h11a5 5 0 0 1 0 10h-1"/></svg></button>
      <button class="btn icon" data-act="redo" title="Redo (Ctrl/Cmd+Shift+Z)"><svg viewBox="0 0 24 24"><path d="M15 7l5 5-5 5"/><path d="M20 12H9a5 5 0 0 0 0 10h1"/></svg></button>
      <button class="btn icon" data-act="duplicate" title="Duplicate (Ctrl/Cmd+D)"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5h10"/></svg></button>
      <button class="btn icon" data-act="delete" title="Delete (Del)"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14"/></svg></button>
    </div>

    <div class="tb-group" id="g-arrange">
      <button class="btn icon" data-act="front" title="Bring to front"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="12" height="12" rx="1"/><rect x="9" y="9" width="12" height="12" rx="1"/></svg></button>
      <button class="btn icon" data-act="back" title="Send to back"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="1"/><rect x="3" y="3" width="12" height="12" rx="1"/></svg></button>
      <div class="menu-wrap">
        <button class="btn" data-menu="align" title="Align">Align ▾</button>
        <div class="menu" id="menu-align">
          <button data-act="align-left">Align Left</button>
          <button data-act="align-center">Align Center (H)</button>
          <button data-act="align-right">Align Right</button>
          <button data-act="align-top">Align Top</button>
          <button data-act="align-middle">Align Middle (V)</button>
          <button data-act="align-bottom">Align Bottom</button>
          <div class="sep"></div>
          <button data-act="dist-h">Distribute Horizontally</button>
          <button data-act="dist-v">Distribute Vertically</button>
        </div>
      </div>
      <button class="btn icon" data-act="group" title="Group (Ctrl/Cmd+G)"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" stroke-dasharray="3 3"/></svg></button>
      <button class="btn icon" data-act="ungroup" title="Ungroup (Ctrl/Cmd+Shift+G)"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="9" height="9"/><rect x="13" y="13" width="8" height="8"/></svg></button>
    </div>

    <div class="tb-group" id="g-view">
      <button class="btn icon" data-act="zoom-out" title="Zoom out (Ctrl/Cmd -)"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M21 21l-4-4"/></svg></button>
      <input class="zoom-input" id="zoom-input" value="100%" title="Zoom level">
      <button class="btn icon" data-act="zoom-in" title="Zoom in (Ctrl/Cmd +)"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M11 8v6M8 11h6M21 21l-4-4"/></svg></button>
      <button class="btn" data-act="fit" title="Fit to screen (Shift+1)">Fit</button>
      <button class="btn icon" data-act="grid" title="Toggle grid"><svg viewBox="0 0 24 24"><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg></button>
      <button class="btn icon" data-act="snap" title="Toggle snap"><svg viewBox="0 0 24 24"><path d="M5 3v7a7 7 0 0 0 14 0V3"/><path d="M12 17v4"/></svg></button>
      <button class="btn icon" data-act="legend" title="Toggle legend"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 9h4M7 13h4M15 9h2M15 13h2"/></svg></button>
    </div>

    <div class="spacer"></div>
    <div class="tb-group">
      <select class="tb-select" id="theme-select" title="Diagram theme / flavor">
        <option value="light">Light / Print</option>
        <option value="slate">Deep Slate IDE</option>
        <option value="blueprint">Blueprint</option>
        <option value="contrast">High Contrast</option>
        <option value="pastel">Pastel / Soft</option>
        <option value="corporate">Corporate</option>
      </select>
      <button class="btn" data-act="help" title="Help & shortcuts">? Help</button>
    </div>
  </div>

  <!-- ===================== MIDDLE ROW ===================== -->
  <div id="middle">
    <!-- LEFT: shape palette -->
    <aside class="panel" id="left-panel">
      <div class="panel-head"><span>Shapes</span><button class="close-x" data-collapse="left" title="Collapse">‹</button></div>
      <div class="search-box"><input id="shape-search" placeholder="Search shapes…" aria-label="Search shapes"></div>
      <div class="panel-body" id="palette"></div>
    </aside>

    <!-- CENTER: canvas -->
    <main id="canvas-wrap">
      <svg id="svg" xmlns="http://www.w3.org/2000/svg" aria-label="Diagram canvas"></svg>
    </main>

    <!-- RIGHT: inspector -->
    <aside class="panel" id="right-panel">
      <div class="panel-head"><span id="insp-title">Diagram</span><button class="close-x" data-collapse="right" title="Collapse">›</button></div>
      <div class="panel-body" id="inspector"></div>
    </aside>
  </div>

  <!-- ===================== STATUS BAR ===================== -->
  <div id="statusbar">
    <span class="si" id="st-zoom">100%</span>
    <span class="si" id="st-coords">x: 0, y: 0</span>
    <span class="si" id="st-sel">No selection</span>
    <span class="si"><span class="dot on" id="st-grid-dot"></span>Grid</span>
    <span class="si"><span class="dot on" id="st-snap-dot"></span>Snap</span>
    <div id="legend-strip"></div>
  </div>
</div>

<!-- hidden file input for Open -->
<input type="file" id="file-input" accept="application/json,.json,image/svg+xml,.svg,image/png,image/jpeg,image/gif,image/webp,.png,.jpg,.jpeg,.gif,.webp" style="display:none">

<!-- toasts -->
<div id="toasts" aria-live="polite"></div>

<!-- context menu -->
<div id="ctxmenu"></div>

<!-- HELP overlay -->
<div class="overlay" id="help-overlay">
  <div class="modal">
    <div class="modal-head"><h2>Quick Start &amp; Keyboard Shortcuts</h2><button class="close-x" data-close="help-overlay">×</button></div>
    <div class="modal-body" id="help-body"></div>
  </div>
</div>

<!-- TEMPLATES overlay -->
<div class="overlay" id="tpl-overlay">
  <div class="modal">
    <div class="modal-head"><h2>New from Template</h2><button class="close-x" data-close="tpl-overlay">×</button></div>
    <div class="modal-body"><div class="tpl-grid" id="tpl-grid"></div></div>
  </div>
</div>

<!-- EXPORT PNG overlay -->
<div class="overlay" id="png-overlay">
  <div class="modal" style="max-width:420px">
    <div class="modal-head"><h2>Export PNG</h2><button class="close-x" data-close="png-overlay">×</button></div>
    <div class="modal-body">

function wrapText(text,maxW,fontPx,family,weight){const out=[];const paras=String(text==null?"":text).split("\n");for(const para of paras){if(para===""){out.push("");continue;}const words=para.split(/(\s+)/);let line="";for(const w of words){const test=line+w;if(measureText(test.trimEnd(),fontPx,family,weight)>maxW&&line.trim()){out.push(line.trimEnd());line=w.replace(/^\s+/,"");}else line=test;}if(line.trim()||line==="")out.push(line.trimEnd());}return out.length?out:[""];}

/* ============================== STATE ============================== */
function blankDoc(){
  return {
    version:"1.0",
    meta:{title:"Untitled Diagram",subtitle:"",cornerText:"",cornerSub:"",footer:"",theme:"light",createdAt:nowISO(),modifiedAt:nowISO()},
    canvas:{width:1600,height:1000,grid:{show:true,size:16,snap:true},background:"#ffffff"},

const STATE={

  sel:new Set(),          // selected ids (nodes/edges/lanes/groups)

function D(){return STATE.doc;}
function findNode(id){return D().nodes.find(n=>n.id===id);}
function findEdge(id){return D().edges.find(e=>e.id===id);}
function findLane(id){return D().lanes.find(l=>l.id===id);}
function findGroup(id){return D().groups.find(g=>g.id===id);}
function anyObj(id){return findNode(id)||findEdge(id)||findLane(id)||findGroup(id);}
function objKind(id){if(findNode(id))return"node";if(findEdge(id))return"edge";if(findLane(id))return"lane";if(findGroup(id))return"group";return null;}

/* default node factory from a type/shape */
function makeNode(type,x,y){
  const p=TYPE_PRESETS[type]||TYPE_PRESETS.process;
  const isTerm=type==="start"||type==="end";
  const isDia=p.shape==="diamond";
  const n={
    id:uid("n"),type,shape:p.shape,x,y,
    w:isDia?170:200,h:isDia?100:(isTerm?56:80),rotation:0,
    title:p.label,body:"",monospaceBody:false,
    icon:p.icon,iconColor:p.accent,
    badge:{show:false,value:"",color:"#c92a2a"},
    accent:{show:p.shape!=="diamond"&&!isTerm,color:p.accent,width:5},
    fill:p.fill,stroke:THEMES.light.nodeStroke,strokeWidth:1.4,strokeStyle:"solid",radius:10,
    textColor:isTerm?"#ffffff":"#1f2937",fontSize:13,align:isTerm?"center":"left",

/* ============================== SHAPE GEOMETRY ====================== */
/* Returns array of SVG element specs {tag,attrs} drawing the outline at 0,0 size w,h. */
function shapeOutline(shape,w,h,style){
  const base={fill:style.fill,stroke:style.stroke,"stroke-width":style.strokeWidth,
    "stroke-dasharray":style.strokeStyle==="dashed"?"7 5":(style.strokeStyle==="dotted"?"2 4":null)};
  const r=style.radius||0;
  switch(shape){
    case "rect": return [{tag:"rect",attrs:{x:0,y:0,width:w,height:h,...base}}];
    case "roundrect": case "note": case "card": case "display":
      return [{tag:"rect",attrs:{x:0,y:0,width:w,height:h,rx:shape==="display"?h/2:r,ry:shape==="display"?h/2:r,...base}}];
    case "terminator":
      return [{tag:"rect",attrs:{x:0,y:0,width:w,height:h,rx:h/2,ry:h/2,...base}}];
    case "diamond":
      return [{tag:"path",attrs:{d:`M${w/2} 0 L${w} ${h/2} L${w/2} ${h} L0 ${h/2} Z`,...base}}];
    case "circle":{const d=Math.min(w,h);return [{tag:"ellipse",attrs:{cx:w/2,cy:h/2,rx:w/2,ry:h/2,...base}}];}
    case "ellipse": return [{tag:"ellipse",attrs:{cx:w/2,cy:h/2,rx:w/2,ry:h/2,...base}}];
    case "parallelogram":{const s=Math.min(28,w*0.18);return [{tag:"path",attrs:{d:`M${s} 0 L${w} 0 L${w-s} ${h} L0 ${h} Z`,...base}}];}
    case "trapezoid":{const s=Math.min(26,w*0.16);return [{tag:"path",attrs:{d:`M${s} 0 L${w-s} 0 L${w} ${h} L0 ${h} Z`,...base}}];}
    case "hexagon":{const s=Math.min(26,w*0.16);return [{tag:"path",attrs:{d:`M${s} 0 L${w-s} 0 L${w} ${h/2} L${w-s} ${h} L${s} ${h} L0 ${h/2} Z`,...base}}];}
    case "pentagon":{const s=Math.min(24,w*0.16);return [{tag:"path",attrs:{d:`M0 0 L${w-s} 0 L${w} ${h/2} L${w-s} ${h} L0 ${h} Z`,...base}}];}
    case "predefined":
      return [{tag:"rect",attrs:{x:0,y:0,width:w,height:h,...base}},
        {tag:"line",attrs:{x1:10,y1:0,x2:10,y2:h,stroke:style.stroke,"stroke-width":style.strokeWidth}},
        {tag:"line",attrs:{x1:w-10,y1:0,x2:w-10,y2:h,stroke:style.stroke,"stroke-width":style.strokeWidth}}];
    case "internalstorage":
      return [{tag:"rect",attrs:{x:0,y:0,width:w,height:h,...base}},
        {tag:"line",attrs:{x1:0,y1:14,x2:w,y2:14,stroke:style.stroke,"stroke-width":style.strokeWidth}},
        {tag:"line",attrs:{x1:14,y1:0,x2:14,y2:h,stroke:style.stroke,"stroke-width":style.strokeWidth}}];
    case "cylinder":{const e=Math.min(16,h*0.18);
      return [{tag:"path",attrs:{d:`M0 ${e} C0 ${-e*0.4} ${w} ${-e*0.4} ${w} ${e} L${w} ${h-e} C${w} ${h+e*0.4} 0 ${h+e*0.4} 0 ${h-e} Z`,...base}},
        {tag:"path",attrs:{d:`M0 ${e} C0 ${e*2.2} ${w} ${e*2.2} ${w} ${e}`,fill:"none",stroke:style.stroke,"stroke-width":style.strokeWidth}}];}
    case "document":{const c=Math.min(18,h*0.2);
      return [{tag:"path",attrs:{d:`M0 0 L${w} 0 L${w} ${h-c} Q${w*0.75} ${h-c*2.2} ${w/2} ${h-c} T0 ${h-c} Z`,...base}}];}
    case "multidoc":{const o=6,c=Math.min(16,h*0.18);
      return [{tag:"rect",attrs:{x:o*2,y:0,width:w-o*2,height:h-c-o*2,fill:style.fill,stroke:style.stroke,"stroke-width":style.strokeWidth}},
        {tag:"rect",attrs:{x:o,y:o,width:w-o*2,height:h-c-o,fill:style.fill,stroke:style.stroke,"stroke-width":style.strokeWidth}},
        {tag:"path",attrs:{d:`M0 ${o*2} L${w-o*2} ${o*2} L${w-o*2} ${h-c} Q${(w-o*2)*0.72} ${h-c*2.2} ${(w-o*2)/2} ${h-c} T0 ${h-c} Z`,...base}}];}
    case "junction":{const d=Math.min(w,h);return [{tag:"circle",attrs:{cx:w/2,cy:h/2,r:d/2,fill:style.accentColor||style.stroke,stroke:"none"}}];}
    default: return [{tag:"rect",attrs:{x:0,y:0,width:w,height:h,rx:r,...base}}];
  }
}

/* effective style for a node, merging theme defaults when fields blank */
function nodeStyle(n){
  const th=theme();
  return {
    fill:n.fill||th.nodeFill,
    stroke:n.stroke||th.nodeStroke,
    strokeWidth:n.strokeWidth==null?1.4:n.strokeWidth,
    strokeStyle:n.strokeStyle||"solid",
    radius:n.radius==null?10:n.radius,
    textColor:n.textColor||th.nodeText,
    accentColor:(n.accent&&n.accent.color)||"#5c6b7e"
  };
}
/* ============================== RENDER ============================== */
const svg=$("#svg");
let LAYERS={};

  LAYERS.grid=svgEl("g",{id:"L-grid"});
  LAYERS.lanes=svgEl("g",{id:"L-lanes"});
  LAYERS.groups=svgEl("g",{id:"L-groups"});
  LAYERS.edges=svgEl("g",{id:"L-edges"});
  LAYERS.nodes=svgEl("g",{id:"L-nodes"});
  LAYERS.overlay=svgEl("g",{id:"L-overlay"});
  LAYERS.chrome=svgEl("g",{id:"L-chrome"});
  [LAYERS.grid,LAYERS.lanes,LAYERS.groups,LAYERS.chrome,LAYERS.edges,LAYERS.nodes,LAYERS.overlay].forEach(l=>vp.appendChild(l));
}
function applyView(){
  const v=STATE.view;
  $("#viewport").setAttribute("transform",`translate(${v.panX} ${v.panY}) scale(${v.zoom})`);
  $("#zoom-input").value=Math.round(v.zoom*100)+"%";
  $("#st-zoom").textContent=Math.round(v.zoom*100)+"%";
}
function screenToWorld(cx,cy){const r=svg.getBoundingClientRect();const v=STATE.view;return {x:(cx-r.left-v.panX)/v.zoom,y:(cy-r.top-v.panY)/v.zoom};}
function snap(val){const g=D().canvas.grid;return (g.snap?Math.round(val/g.size)*g.size:val);}

let _renderQueued=false;
function requestRender(){if(_renderQueued)return;_renderQueued=true;requestAnimationFrame(()=>{_renderQueued=false;render();});}

function render(){
  renderGrid();renderChrome();renderLanes();renderGroups();
  renderEdges();renderNodes();renderOverlay();
  applyView();renderLegend();updateStatus();
}

function renderGrid(){
  const L=LAYERS.grid;L.innerHTML="";
  const c=D().canvas,g=c.grid,th=theme();
  L.appendChild(svgEl("rect",{x:-2000,y:-2000,width:c.width+4000,height:c.height+4000,fill:th.canvasBg}));
  L.appendChild(svgEl("rect",{x:0,y:0,width:c.width,height:c.height,fill:th.canvasBg,stroke:th.grid,"stroke-width":1}));
  if(!g.show)return;
  const defs=$("#defs");
  let pat=$("#gridpat");if(pat)pat.remove();
  pat=svgEl("pattern",{id:"gridpat",width:g.size,height:g.size,patternUnits:"userSpaceOnUse"});
  pat.appendChild(svgEl("circle",{cx:1,cy:1,r:1,fill:th.grid}));
  defs.appendChild(pat);
  L.appendChild(svgEl("rect",{x:0,y:0,width:c.width,height:c.height,fill:"url(#gridpat)"}));
}

function renderChrome(){
  const L=LAYERS.chrome;L.innerHTML="";const m=D().meta,th=theme();
  const tc=th.canvasBg==="#ffffff"||th.nodeText==="#000000"?"#1f2a3d":(th.nodeText);
  if(m.title){
    const t=svgEl("text",{x:20,y:42,"font-family":"var(--font-ui)","font-size":34,"font-weight":700,fill:tc});
    t.textContent=m.title;L.appendChild(t);
    const tw=measureText(m.title,34,"Inter","700");
    L.appendChild(svgEl("rect",{x:20,y:52,width:Math.min(tw*0.5,170),height:5,rx:2,fill:"#c92a2a"}));
  }
  if(m.subtitle){const s=svgEl("text",{x:20,y:84,"font-size":15,fill:"#6b7a90"});s.textContent=m.subtitle;L.appendChild(s);}

  STATE.history=STATE.history.slice(0,STATE.histIndex+1);
  STATE.history.push(snap);
  if(STATE.history.length>200)STATE.history.shift();
  STATE.histIndex=STATE.history.length-1;
}
function commit(){
  STATE.doc.meta.modifiedAt=nowISO();
  snapshot();requestRender();
}
function undo(){if(STATE.histIndex<=0){toast("Nothing to undo","info",1200);return;}STATE.histIndex--;STATE.doc=JSON.parse(STATE.history[STATE.histIndex]);pruneSel();render();}
function redo(){if(STATE.histIndex>=STATE.history.length-1){toast("Nothing to redo","info",1200);return;}STATE.histIndex++;STATE.doc=JSON.parse(STATE.history[STATE.histIndex]);pruneSel();render();}
function pruneSel(){for(const id of [...STATE.sel])if(!anyObj(id))STATE.sel.delete(id);buildInspector();}
function resetHistory(){STATE.history=[];STATE.histIndex=-1;snapshot();}
/* ============================== INTERACTION ======================== */
let spaceDown=false;
function setTool(t){STATE.tool=t;svg.classList.toggle("tool-hand",t==="hand");svg.classList.toggle("tool-connector",t==="connector");
  $$("#toolbar [data-tool]").forEach(b=>b.classList.toggle("active",b.dataset.tool===t));}
function select(id,additive){
  if(!additive)STATE.sel.clear();
  if(id){if(additive&&STATE.sel.has(id))STATE.sel.delete(id);else STATE.sel.add(id);}
  requestRender();buildInspector();
}
function selectMany(ids){STATE.sel=new Set(ids);requestRender();buildInspector();}

svg.addEventListener("mousedown",onDown);
function onDown(ev){
  if(ev.button===2)return; // context menu handled separately
  closeMenus();
  const w=screenToWorld(ev.clientX,ev.clientY);
  const isPan=ev.button===1||spaceDown||STATE.tool==="hand";
  if(isPan){STATE.drag={type:"pan",sx:ev.clientX,sy:ev.clientY,px:STATE.view.panX,py:STATE.view.panY};svg.classList.add("panning");startDrag();return;}
  const target=ev.target;
  // handle (resize)
  const handle=target.closest(".handle");
  if(handle){const n=findNode([...STATE.sel][0]);if(n){STATE.drag={type:"resize",dir:handle.dataset.dir,n,ox:n.x,oy:n.y,ow:n.w,oh:n.h,wx:w.x,wy:w.y,aspect:ev.shiftKey};startDrag();}return;}
  // port (start connector)
  const port=target.closest(".port");
  if(port){STATE.connectFrom={nodeId:port.dataset.node,anchor:port.dataset.anchor,preview:null};
    const p=anchorPoint(findNode(port.dataset.node),port.dataset.anchor);
    STATE.drag={type:"connect",p1:p};startDrag();return;}
  // edge label drag
  const lbl=target.closest(".edge-label");
  if(lbl){const e=findEdge(lbl.dataset.id);select(e.id,ev.shiftKey);STATE.drag={type:"edgelabel",e};startDrag();return;}
  // edge select
  const edge=target.closest(".edge");
  if(edge){select(edge.dataset.id,ev.shiftKey);return;}
  // node
  const nodeG=target.closest(".node");
  if(nodeG){
    const id=nodeG.dataset.id;
    if(STATE.tool==="connector"){handleConnectorClick(id);return;}
    if(!STATE.sel.has(id))select(id,ev.shiftKey);
    else if(ev.shiftKey){select(id,true);return;}
    // start move (with alt-clone)
    const nodes=[...STATE.sel].map(findNode).filter(Boolean);
    if(ev.altKey){const copies=nodes.map(n=>{const c=clone(n);c.id=uid("n");return c;});D().nodes.push(...copies);STATE.sel=new Set(copies.map(c=>c.id));}
    const moveNodes=[...STATE.sel].map(findNode).filter(Boolean);
    STATE.drag={type:"move",nodes:moveNodes.map(n=>({n,ox:n.x,oy:n.y})),wx:w.x,wy:w.y,moved:false};
    startDrag();return;
  }
  // lane / group select+move
  const laneG=target.closest(".lane");
  if(laneG){const l=findLane(laneG.dataset.id);select(l.id,ev.shiftKey);STATE.drag={type:"movelane",l,ox:l.x,oy:l.y,wx:w.x,wy:w.y,withNodes:ev.altKey?false:laneMovesNodes};startDrag();return;}
  const grpG=target.closest(".group");
  if(grpG){const gr=findGroup(grpG.dataset.id);select(gr.id,ev.shiftKey);STATE.drag={type:"movegroup",gr,ox:gr.x,oy:gr.y,wx:w.x,wy:w.y,children:childrenOfGroup(gr)};startDrag();return;}
  // empty canvas -> marquee
  if(!ev.shiftKey)select(null);
  STATE.drag={type:"marquee",x0:w.x,y0:w.y,x1:w.x,y1:w.y,additive:ev.shiftKey,base:new Set(STATE.sel)};
  startDrag();
}
let laneMovesNodes=true;
function childrenOfGroup(gr){return D().nodes.filter(n=>n.groupId===gr.id);}

function startDrag(){window.addEventListener("mousemove",onMove);window.addEventListener("mouseup",onUp);}
function endDrag(){window.removeEventListener("mousemove",onMove);window.removeEventListener("mouseup",onUp);}

function onMove(ev){
  const d=STATE.drag;if(!d)return;
  const w=screenToWorld(ev.clientX,ev.clientY);
  if(d.type==="pan"){STATE.view.panX=d.px+(ev.clientX-d.sx);STATE.view.panY=d.py+(ev.clientY-d.sy);applyView();return;}
  if(d.type==="move"){
    let dx=w.x-d.wx,dy=w.y-d.wy;
    if(D().canvas.grid.snap){dx=Math.round(dx/D().canvas.grid.size)*D().canvas.grid.size;dy=Math.round(dy/D().canvas.grid.size)*D().canvas.grid.size;}
    if(dx||dy)d.moved=true;
    for(const it of d.nodes){it.n.x=it.ox+dx;it.n.y=it.oy+dy;}
    fastUpdateNodes(d.nodes.map(it=>it.n));return;
  }
  if(d.type==="resize"){doResize(d,w,ev.shiftKey);fastUpdateNodes([d.n]);renderOverlay();return;}
  if(d.type==="connect"){d.p2={x:w.x,y:w.y};STATE.connectFrom.preview={x1:d.p1.x,y1:d.p1.y,x2:w.x,y2:w.y};
    const over=document.elementFromPoint(ev.clientX,ev.clientY);const ng=over&&over.closest&&over.closest(".node");STATE.hoverNode=ng?ng.dataset.id:null;renderOverlay();return;}
  if(d.type==="edgelabel"){const dpath=edgePath(d.e);d.e.labelPos=fracFromPoint(dpath,w.x,w.y);requestRender();return;}
  if(d.type==="movelane"){let dx=snap(d.ox+(w.x-d.wx))-d.l.x,dy=snap(d.oy+(w.y-d.wy))-d.l.y;d.l.x+=dx;d.l.y+=dy;if(d.withNodes){D().nodes.filter(n=>n.laneId===d.l.id).forEach(n=>{n.x+=dx;n.y+=dy;});}requestRender();return;}
  if(d.type==="movegroup"){let nx=snap(d.ox+(w.x-d.wx)),ny=snap(d.oy+(w.y-d.wy));const dx=nx-d.gr.x,dy=ny-d.gr.y;d.gr.x=nx;d.gr.y=ny;d.children.forEach(n=>{n.x+=dx;n.y+=dy;});requestRender();return;}
  if(d.type==="marquee"){d.x1=w.x;d.y1=w.y;applyMarquee(d);renderOverlay();return;}
}
function doResize(d,w,keepAspect){
  let dx=w.x-d.wx,dy=w.y-d.wy;const dir=d.dir;const MIN=40;
  let x=d.ox,y=d.oy,ww=d.ow,h=d.oh;
  if(dir.includes("e"))ww=Math.max(MIN,d.ow+dx);
  if(dir.includes("s"))h=Math.max(MIN,d.oh+dy);
  if(dir.includes("w")){ww=Math.max(MIN,d.ow-dx);x=d.ox+(d.ow-ww);}
  if(dir.includes("n")){h=Math.max(MIN,d.oh-dy);y=d.oy+(d.oh-h);}
  if(keepAspect||d.aspect){const ar=d.ow/d.oh;if(dir.length===2){h=ww/ar;if(dir.includes("n"))y=d.oy+(d.oh-h);}}
  if(D().canvas.grid.snap){ww=Math.round(ww/D().canvas.grid.size)*D().canvas.grid.size;h=Math.round(h/D().canvas.grid.size)*D().canvas.grid.size;}
  d.n.x=x;d.n.y=y;d.n.w=ww;d.n.h=h;
}
function applyMarquee(d){
  const x=Math.min(d.x0,d.x1),y=Math.min(d.y0,d.y1),x2=Math.max(d.x0,d.x1),y2=Math.max(d.y0,d.y1);
  const hits=D().nodes.filter(n=>n.x<x2&&n.x+n.w>x&&n.y<y2&&n.y+n.h>y).map(n=>n.id);
  STATE.sel=new Set(d.additive?[...d.base,...hits]:hits);
}
/* fast DOM update of moved/resized nodes + their edges, no full render */
function fastUpdateNodes(nodes){
  for(const n of nodes){
    const g=LAYERS.nodes.querySelector(`.node[data-id="${n.id}"]`);
    if(g){const fresh=buildNode(n);g.replaceWith(fresh);}
  }
  const ids=new Set(nodes.map(n=>n.id));
  for(const e of D().edges)if(ids.has(e.from.nodeId)||ids.has(e.to.nodeId)){
    const g=LAYERS.edges.querySelector(`.edge[data-id="${e.id}"]`);if(g)g.replaceWith(buildEdge(e));
  }
  renderOverlay();
}
function onUp(ev){
  const d=STATE.drag;STATE.drag=null;endDrag();svg.classList.remove("panning");
  if(!d)return;
  if(d.type==="pan")return;
  if(d.type==="connect"){
    const src=STATE.connectFrom;STATE.connectFrom=null;STATE.hoverNode=null;
    const over=document.elementFromPoint(ev.clientX,ev.clientY);
    const ng=over&&over.closest&&over.closest(".node");
    const w=screenToWorld(ev.clientX,ev.clientY);
    const targetId=ng?ng.dataset.id:null;
    if(src&&(targetId&&targetId!==src.nodeId)){
      addEdge(src.nodeId,src.anchor,targetId,"auto");
    }else if(src&&!targetId){
      // dangling endpoint dropped on empty canvas
      const e=newEdge();e.from={nodeId:src.nodeId,anchor:src.anchor};e.to={nodeId:null,anchor:"auto",x:w.x,y:w.y};D().edges.push(e);select(e.id);commit();
    }else render();
    return;
  }
  if(d.type==="marquee"){buildInspector();render();return;}
  if(d.type==="move"&&!d.moved){render();return;}
  if(["move","resize","movelane","movegroup","edgelabel"].includes(d.type)){
    // assign lane membership on drop for moved nodes
    if(d.type==="move")for(const it of d.nodes)assignLane(it.n);
    commit();buildInspector();return;
  }
  render();
}
function newEdge(){return {id:uid("e"),from:{nodeId:null,anchor:"auto"},to:{nodeId:null,anchor:"auto"},routing:"orthogonal",lineStyle:"solid",color:"",width:2,startArrow:"none",endArrow:"standard",label:"",labelPos:0.5,preset:"sequence",waypoints:[]};}
function addEdge(fromId,fromA,toId,toA){const e=newEdge();e.from={nodeId:fromId,anchor:fromA||"auto"};e.to={nodeId:toId,anchor:toA||"auto"};D().edges.push(e);select(e.id);commit();return e;}
/* connector tool: click source then target */
function handleConnectorClick(id){
  if(!STATE._connSrc){STATE._connSrc=id;toast("Click target node…","info",1400);}
  else{if(id!==STATE._connSrc)addEdge(STATE._connSrc,"auto",id,"auto");STATE._connSrc=null;}
}
/* wheel zoom + scroll pan */
$("#canvas-wrap").addEventListener("wheel",ev=>{
  if(ev.ctrlKey||ev.metaKey){ev.preventDefault();const f=ev.deltaY<0?1.12:1/1.12;zoomAt(ev.clientX,ev.clientY,f);}
  else{STATE.view.panX-=ev.deltaX;STATE.view.panY-=ev.deltaY;applyView();}
},{passive:false});
function zoomAt(cx,cy,factor){
  const v=STATE.view;const r=svg.getBoundingClientRect();
  const wx=(cx-r.left-v.panX)/v.zoom,wy=(cy-r.top-v.panY)/v.zoom;
  v.zoom=clamp(v.zoom*factor,0.15,5);
  v.panX=cx-r.left-wx*v.zoom;v.panY=cy-r.top-wy*v.zoom;
  render();
}
function zoomTo(z){const r=svg.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,z/STATE.view.zoom);}
function assignLane(n){
  const c=nodeCenter(n);let found=null;
  for(const l of D().lanes)if(c.x>=l.x&&c.x<=l.x+l.w&&c.y>=l.y&&c.y<=l.y+l.h){found=l.id;}
  n.laneId=found;
  let g=null;for(const gr of D().groups)if(c.x>=gr.x&&c.x<=gr.x+gr.w&&c.y>=gr.y&&c.y<=gr.y+gr.h)g=gr.id;
  n.groupId=g;
}
/* hover to reveal ports */
svg.addEventListener("mousemove",ev=>{
  if(STATE.drag)return;
  const w=screenToWorld(ev.clientX,ev.clientY);
  $("#st-coords").textContent=`x: ${Math.round(w.x)}, y: ${Math.round(w.y)}`;
  const ng=ev.target.closest&&ev.target.closest(".node");
  const id=ng?ng.dataset.id:null;
  if(id!==STATE.hoverNode){STATE.hoverNode=id;renderOverlay();}
});
svg.addEventListener("mouseleave",()=>{if(STATE.hoverNode){STATE.hoverNode=null;renderOverlay();}});

/* double-click inline edit */
svg.addEventListener("dblclick",ev=>{
  const ng=ev.target.closest&&ev.target.closest(".node");
  if(ng){editNodeInline(findNode(ng.dataset.id));return;}
  const eg=ev.target.closest&&ev.target.closest(".edge");
  if(eg){const e=findEdge(eg.dataset.id);const v=prompt("Edge label:",e.label||"");if(v!=null){e.label=v;commit();}return;}
  // dbl click empty -> add process
  const w=screenToWorld(ev.clientX,ev.clientY);addNodeAt("process",snap(w.x)-100,snap(w.y)-40);
});
function editNodeInline(n){
  const r=svg.getBoundingClientRect();const v=STATE.view;
  const sx=r.left+v.panX+n.x*v.zoom,sy=r.top+v.panY+n.y*v.zoom;
  const ta=document.createElement("textarea");ta.className="inline-editor";
  ta.value=(n.title||"")+(n.body?"\n"+n.body:"");
  ta.style.left=sx+"px";ta.style.top=sy+"px";ta.style.width=(n.w*v.zoom)+"px";ta.style.minHeight=(n.h*v.zoom)+"px";
  ta.style.fontSize=(13*v.zoom)+"px";
  document.body.appendChild(ta);ta.focus();ta.select();
  const finish=(save)=>{if(save){const lines=ta.value.split("\n");n.title=lines[0]||"";n.body=lines.slice(1).join("\n");commit();}ta.remove();};
  ta.addEventListener("blur",()=>finish(true));
  ta.addEventListener("keydown",e=>{if(e.key==="Escape"){e.preventDefault();finish(false);}if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();finish(true);}e.stopPropagation();});
}
function addNodeAt(type,x,y){const n=makeNode(type,x,y);D().nodes.push(n);assignLane(n);select(n.id);commit();return n;}

/* ============================== CLIPBOARD / ARRANGE =============== */
function deleteSel(){if(!STATE.sel.size)return;
  for(const id of STATE.sel){
    if(findNode(id)){D().nodes=D().nodes.filter(n=>n.id!==id);D().edges=D().edges.filter(e=>e.from.nodeId!==id&&e.to.nodeId!==id);}
    else if(findEdge(id))D().edges=D().edges.filter(e=>e.id!==id);
    else if(findLane(id))D().lanes=D().lanes.filter(l=>l.id!==id);
    else if(findGroup(id))D().groups=D().groups.filter(g=>g.id!==id);
  }
  STATE.sel.clear();commit();buildInspector();
}
function copySel(){const nodes=[...STATE.sel].map(findNode).filter(Boolean);const ids=new Set(nodes.map(n=>n.id));
  const edges=D().edges.filter(e=>ids.has(e.from.nodeId)&&ids.has(e.to.nodeId));
  STATE.clipboard={nodes:clone(nodes),edges:clone(edges)};STATE.pasteCount=0;}
function cutSel(){copySel();deleteSel();}
function paste(){if(!STATE.clipboard)return;STATE.pasteCount++;const off=20*STATE.pasteCount;const map={};const newNodes=[];
  for(const n of STATE.clipboard.nodes){const c=clone(n);c.id=uid("n");map[n.id]=c.id;c.x+=off;c.y+=off;newNodes.push(c);D().nodes.push(c);}
  for(const e of STATE.clipboard.edges){const c=clone(e);c.id=uid("e");c.from.nodeId=map[e.from.nodeId];c.to.nodeId=map[e.to.nodeId];D().edges.push(c);}
  STATE.sel=new Set(newNodes.map(n=>n.id));commit();buildInspector();}
function duplicateSel(){copySel();paste();}
function zorder(mode){const nodes=[...STATE.sel].filter(findNode);if(!nodes.length)return;
  for(const id of nodes){const i=D().nodes.findIndex(n=>n.id===id);if(i<0)continue;const [n]=D().nodes.splice(i,1);
    if(mode==="front")D().nodes.push(n);else if(mode==="back")D().nodes.unshift(n);}
  commit();}
function alignSel(mode){const nodes=[...STATE.sel].map(findNode).filter(Boolean);if(nodes.length<2)return;
  const minX=Math.min(...nodes.map(n=>n.x)),maxX=Math.max(...nodes.map(n=>n.x+n.w));
  const minY=Math.min(...nodes.map(n=>n.y)),maxY=Math.max(...nodes.map(n=>n.y+n.h));
  const cx=(minX+maxX)/2,cy=(minY+maxY)/2;
  for(const n of nodes){
    if(mode==="left")n.x=minX;else if(mode==="right")n.x=maxX-n.w;else if(mode==="center")n.x=cx-n.w/2;
    else if(mode==="top")n.y=minY;else if(mode==="bottom")n.y=maxY-n.h;else if(mode==="middle")n.y=cy-n.h/2;
  }commit();}
function distribute(axis){const nodes=[...STATE.sel].map(findNode).filter(Boolean);if(nodes.length<3)return;
  nodes.sort((a,b)=>axis==="h"?a.x-b.x:a.y-b.y);
  const first=nodes[0],last=nodes[nodes.length-1];
  const total=axis==="h"?(last.x-first.x):(last.y-first.y);const step=total/(nodes.length-1);
  nodes.forEach((n,i)=>{if(axis==="h")n.x=first.x+step*i;else n.y=first.y+step*i;});commit();}
function groupSel(){const nodes=[...STATE.sel].map(findNode).filter(Boolean);if(nodes.length<1)return;
  const minX=Math.min(...nodes.map(n=>n.x))-18,minY=Math.min(...nodes.map(n=>n.y))-30;
  const maxX=Math.max(...nodes.map(n=>n.x+n.w))+18,maxY=Math.max(...nodes.map(n=>n.y+n.h))+18;
  const g={id:uid("g"),label:"Group",x:minX,y:minY,w:maxX-minX,h:maxY-minY,style:"dashed",color:"#7c6cf0",fill:"rgba(124,108,240,0.04)"};
  D().groups.push(g);nodes.forEach(n=>n.groupId=g.id);select(g.id);commit();}
function ungroupSel(){for(const id of [...STATE.sel])if(findGroup(id)){D().nodes.forEach(n=>{if(n.groupId===id)n.groupId=null;});D().groups=D().groups.filter(g=>g.id!==id);}commit();}
/* ============================== INSPECTOR ========================== */
const INSP=$("#inspector");
function h(html){const d=document.createElement("div");d.innerHTML=html.trim();return d.firstChild;}
function sec(title,inner){return `<div class="insp-section"><h4>${title}</h4>${inner}</div>`;}
function field(label,inner){return `<div class="field"><label>${label}</label>${inner}</div>`;}
function txt(id,val){return `<input type="text" data-bind="${id}" value="${esc(val)}">`;}
function num(id,val,min,max,step){return `<input type="number" data-bind="${id}" value="${val}" ${min!=null?`min="${min}"`:""} ${max!=null?`max="${max}"`:""} step="${step||1}">`;}
function color(id,val){return `<input type="color" data-bind="${id}" value="${val||"#000000"}">`;}
function chk(id,val,label){return `<label class="chk"><input type="checkbox" data-bind="${id}" ${val?"checked":""}>${label}</label>`;}
function sel(id,val,opts){return `<select data-bind="${id}">`+opts.map(o=>{const v=Array.isArray(o)?o[0]:o,l=Array.isArray(o)?o[1]:o;return `<option value="${v}" ${v===val?"selected":""}>${l}</option>`;}).join("")+`</select>`;}

function buildInspector(){
  const ids=[...STATE.sel];
  if(ids.length===0){return inspDiagram();}
  if(ids.length===1){const k=objKind(ids[0]);
    if(k==="node")return inspNode(findNode(ids[0]));
    if(k==="edge")return inspEdge(findEdge(ids[0]));
    if(k==="lane")return inspLane(findLane(ids[0]));
    if(k==="group")return inspGroup(findGroup(ids[0]));
  }
  $("#insp-title").textContent="Multiple";
  INSP.innerHTML=sec("Selection",`<p style="color:var(--muted);font-size:12px">${ids.length} objects selected. Use Align / Distribute / Arrange in the toolbar, or Delete.</p>`);
  bindAll(null);
}

function inspDiagram(){
  $("#insp-title").textContent="Diagram";const m=D().meta,c=D().canvas;
  INSP.innerHTML=
    sec("Diagram chrome",field("Title",txt("meta.title",m.title))+field("Subtitle",txt("meta.subtitle",m.subtitle))
      +field("Corner text",txt("meta.cornerText",m.cornerText))+field("Corner sub-text",txt("meta.cornerSub",m.cornerSub))
      +field("Footer caption",txt("meta.footer",m.footer)))
    +sec("Canvas",`<div class="field-row">${field("Width",num("canvas.width",c.width,400))}${field("Height",num("canvas.height",c.height,400))}</div>`
      +field("Theme / flavor",sel("meta.theme",m.theme,[["light","Light / Print"],["slate","Deep Slate IDE"],["blueprint","Blueprint"],["contrast","High Contrast"],["pastel","Pastel / Soft"],["corporate","Corporate"]]))
      +chk("canvas.grid.show",c.grid.show,"Show grid")+chk("canvas.grid.snap",c.grid.snap,"Snap to grid")
      +`<div class="field-row">${field("Grid size",num("canvas.grid.size",c.grid.size,4,64))}</div>`)
    +sec("Legend",chk("legend.show",D().legend.show,"Show legend")
      +field("Mode",sel("legend.mode",D().legend.mode,[["auto","Auto (from diagram)"],["manual","Manual"]])))
    +sec("Lanes & Groups",`<button class="btn" data-act="add-lane-v" style="margin-bottom:6px;width:100%;justify-content:center">+ Add vertical lane</button>
      <button class="btn" data-act="add-lane-h" style="margin-bottom:6px;width:100%;justify-content:center">+ Add horizontal lane</button>
      <button class="btn" data-act="add-group" style="width:100%;justify-content:center">+ Add container/group</button>`);
  bindAll(null);
}

const SHAPE_OPTS=[["rect","Rectangle"],["roundrect","Rounded"],["diamond","Diamond"],["terminator","Terminator"],["parallelogram","Parallelogram"],["cylinder","Cylinder"],["document","Document"],["multidoc","Multi-document"],["hexagon","Hexagon"],["trapezoid","Trapezoid"],["pentagon","Off-page"],["predefined","Predefined"],["internalstorage","Internal storage"],["display","Display"],["circle","Circle"],["ellipse","Ellipse"],["junction","Junction"],["note","Note"],["card","Card"],["text","Text only"]];
function inspNode(n){
  if(n.shape==="image")return inspImage(n);
  $("#insp-title").textContent="Node";
  const presetChips=Object.keys(TYPE_PRESETS).map(t=>`<div class="preset-chip" data-preset="${t}"><span class="dot" style="background:${TYPE_PRESETS[t].accent}"></span>${TYPE_PRESETS[t].label}</div>`).join("");
  INSP.innerHTML=
    sec("Type preset",`<div class="preset-grid">${presetChips}</div>`)

/* bind every [data-bind] to the target object via dotted path */
function bindAll(obj){
  $$("#inspector [data-bind]").forEach(inp=>{
    const path=inp.dataset.bind;
    const handler=()=>{
      let val;
      if(inp.type==="checkbox")val=inp.checked;
      else if(inp.type==="number"||inp.type==="range")val=parseFloat(inp.value);
      else val=inp.value;
      if(path.startsWith("meta.")||path.startsWith("canvas.")||path.startsWith("legend.")){
        setPath(D(),path,val);
        if(path==="meta.theme"){applyTheme(val);}
      }else if(path==="__laneMovesNodes"){laneMovesNodes=val;return;}
      else if(obj){setPath(obj,path,val);}
      commit();
      if(["shape","badge.show","accent.show","monospaceBody"].includes(path))buildInspector();
    };
    inp.addEventListener("change",handler);
    if(inp.type==="range")inp.addEventListener("input",()=>{let v=parseFloat(inp.value);if(obj)setPath(obj,path,v);else setPath(D(),path,v);requestRender();});
  });
  $$("#inspector [data-preset]").forEach(c=>c.onclick=()=>applyTypePreset([...STATE.sel][0],c.dataset.preset));
  $$("#inspector [data-edgepreset]").forEach(c=>c.onclick=()=>applyEdgePreset([...STATE.sel][0],c.dataset.edgepreset));
}
function setPath(o,path,val){const parts=path.split(".");let t=o;for(let i=0;i<parts.length-1;i++)t=t[parts[i]];t[parts[parts.length-1]]=val;}
function applyTypePreset(id,t){const n=findNode(id);if(!n)return;const p=TYPE_PRESETS[t];n.type=t;n.shape=p.shape;n.accent.color=p.accent;n.accent.show=!["diamond","terminator","cylinder","circle","ellipse"].includes(p.shape);n.fill=p.fill;n.icon=p.icon;n.iconColor=p.accent;
  if(t==="start"||t==="end"){n.textColor="#ffffff";n.align="center";n.accent.show=false;}commit();buildInspector();}
function applyEdgePreset(id,p){const e=findEdge(id);if(!e)return;const pr=EDGE_PRESETS[p];e.preset=p;e.color=pr.color;e.lineStyle=pr.lineStyle;e.endArrow=pr.endArrow;commit();buildInspector();}

const PALETTE=[
  {cat:"Flowchart",items:[["process","Process"],["roundrect","Rounded"],["diamond","Decision"],["terminator","Terminator"],["predefined","Predefined"],["trapezoid","Manual op"],["hexagon","Preparation"],["pentagon","Off-page"],["junction","Junction"]]},
  {cat:"Data",items:[["parallelogram","Data / I-O"],["cylinder","Database"],["document","Document"],["multidoc","Multi-doc"],["internalstorage","Int. storage"],["display","Display"]]},
  {cat:"Containers",items:[["lane-v","Lane (V)"],["lane-h","Lane (H)"],["pool","Pool"],["group","Group"],["frame","Frame"]]},
  {cat:"Annotations",items:[["note","Note"],["card","Info card"],["text","Text label"],["circle","Circle"]]}
];
function paletteIcon(shape){
  const st={fill:"#1c2740",stroke:"#5b6f8c",strokeWidth:1.4,radius:6};
  const specs=shapeOutline(shape==="lane-v"||shape==="lane-h"||shape==="pool"||shape==="frame"||shape==="text"?"rect":shape,30,22,st);
  return `<svg viewBox="-1 -1 32 24">${specs.map(s=>`<${s.tag} ${Object.entries(s.attrs).filter(([k,v])=>v!=null).map(([k,v])=>`${k}="${v}"`).join(" ")}/>`).join("")}</svg>`;
}
function buildPalette(filter){
  const p=$("#palette");p.innerHTML="";
  for(const group of PALETTE){
    const items=group.items.filter(it=>!filter||it[1].toLowerCase().includes(filter)||it[0].includes(filter));
    if(!items.length)continue;
    const cat=h(`<div class="cat"><div class="cat-head"><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>${group.cat}</div><div class="cat-items"></div></div>`);
    const head=cat.querySelector(".cat-head");head.onclick=()=>cat.classList.toggle("closed");
    const box=cat.querySelector(".cat-items");
    for(const [shape,label] of items){
      const item=h(`<div class="shape-item" draggable="true" data-shape="${shape}" title="Add ${label}">${paletteIcon(shape)}<span>${label}</span></div>`);
      item.onclick=()=>addFromPalette(shape,null);
      item.addEventListener("dragstart",ev=>{ev.dataTransfer.setData("text/shape",shape);ev.dataTransfer.effectAllowed="copy";});
      box.appendChild(item);
    }
    p.appendChild(cat);
  }
}
function addFromPalette(shape,pos){
  const center=pos||centerWorld();
  if(shape==="lane-v")return addLane("vertical");
  if(shape==="lane-h")return addLane("horizontal");
  if(shape==="pool")return addPool();
  if(shape==="group"||shape==="frame")return addGroup(shape==="frame"?"solid":"dashed",center);
  // map palette shape -> type
  const typeMap={process:"process",roundrect:"orchestration",diamond:"decision",terminator:"start",cylinder:"datastore",document:"document",parallelogram:"fileio",note:"note",card:"card",text:"process"};
  const type=typeMap[shape]||"process";
  const n=makeNode(type,snap(center.x)-100,snap(center.y)-40);
  n.shape=shape==="text"?"text":(TYPE_PRESETS[type].shape||shape);
  if(["parallelogram","cylinder","document","multidoc","internalstorage","display","hexagon","trapezoid","pentagon","predefined","junction","circle","ellipse"].includes(shape))n.shape=shape;
  if(shape==="text"){n.shape="text";n.title="Text";n.body="";n.shadow=false;n.accent.show=false;}
  if(shape==="junction"){n.w=18;n.h=18;n.title="";n.accent.show=false;n.shadow=false;}
  D().nodes.push(n);assignLane(n);select(n.id);commit();
}

/* ============================== KEYBOARD =========================== */
window.addEventListener("keydown",ev=>{
  if(ev.key===" "&&!isTyping(ev)){spaceDown=true;svg.classList.add("tool-hand");}
  if(isTyping(ev))return;
  const mod=ev.ctrlKey||ev.metaKey;
  const k=ev.key.toLowerCase();
  if(mod){
    if(k==="z"&&!ev.shiftKey){ev.preventDefault();undo();return;}
    if((k==="z"&&ev.shiftKey)||k==="y"){ev.preventDefault();redo();return;}
    if(k==="s"){ev.preventDefault();saveJSON();return;}
    if(k==="o"){ev.preventDefault();$("#file-input").click();return;}
    if(k==="c"){ev.preventDefault();copySel();return;}
    if(k==="x"){ev.preventDefault();cutSel();return;}
    if(k==="v"){ev.preventDefault();paste();return;}
    if(k==="d"){ev.preventDefault();duplicateSel();return;}
    if(k==="a"){ev.preventDefault();selectMany(D().nodes.map(n=>n.id));return;}
    if(k==="g"&&!ev.shiftKey){ev.preventDefault();groupSel();return;}
    if(k==="g"&&ev.shiftKey){ev.preventDefault();ungroupSel();return;}
    if(ev.key==="="||ev.key==="+"){ev.preventDefault();zoomTo(STATE.view.zoom*1.2);return;}
    if(ev.key==="-"){ev.preventDefault();zoomTo(STATE.view.zoom/1.2);return;}
    if(ev.key==="0"){ev.preventDefault();zoomTo(1);return;}
    return;
  }
  if(ev.shiftKey&&ev.key==="!"){ev.preventDefault();fitToScreen();return;}
  if(ev.shiftKey&&ev.key==="1"){ev.preventDefault();fitToScreen();return;}
  switch(k){
    case "v":setTool("select");break;
    case "h":setTool("hand");break;
    case "r":addFromPalette("process");break;
    case "d":addFromPalette("diamond");break;
    case "t":addFromPalette("terminator");break;
    case "c":setTool("connector");STATE._connSrc=null;break;
    case "n":addFromPalette("note");break;
    case "delete":case "backspace":ev.preventDefault();deleteSel();break;
    case "escape":STATE._connSrc=null;STATE.connectFrom=null;setTool("select");select(null);closeMenus();$$(".overlay.open").forEach(o=>o.classList.remove("open"));break;
    case "arrowleft":case "arrowright":case "arrowup":case "arrowdown":ev.preventDefault();nudge(ev.key,ev.shiftKey);break;
  }
});
window.addEventListener("keyup",ev=>{if(ev.key===" "){spaceDown=false;if(STATE.tool!=="hand")svg.classList.remove("tool-hand");}});
function isTyping(ev){const t=ev.target;return t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.tagName==="SELECT"||t.isContentEditable);}
function nudge(key,big){const step=big?(D().canvas.grid.size||10):1;const nodes=[...STATE.sel].map(findNode).filter(Boolean);if(!nodes.length)return;
  const dx=key==="ArrowLeft"?-step:key==="ArrowRight"?step:0;const dy=key==="ArrowUp"?-step:key==="ArrowDown"?step:0;
  nodes.forEach(n=>{n.x+=dx;n.y+=dy;});commit();}
function fitToScreen(){
  const b=contentBBox();if(!b){zoomTo(1);return;}
  const r=svg.getBoundingClientRect();const pad=60;
  const z=clamp(Math.min((r.width-pad*2)/b.w,(r.height-pad*2)/b.h),0.15,3);
  STATE.view.zoom=z;STATE.view.panX=pad-b.x*z+(r.width-pad*2-b.w*z)/2;STATE.view.panY=pad-b.y*z+(r.height-pad*2-b.h*z)/2;
  render();
}
function newDiagram(){STATE.doc=blankDoc();STATE.sel.clear();STATE.view={zoom:1,panX:60,panY:60};applyTheme("light");$("#theme-select").value="light";resetHistory();render();buildInspector();}
/* ============================== BBOX =============================== */
function contentBBox(selOnly){
  let items=[];
  const nodes=selOnly?D().nodes.filter(n=>STATE.sel.has(n.id)):D().nodes;
  for(const n of nodes)items.push({x:n.x,y:n.y,w:n.w,h:n.h});
  if(!selOnly){
    for(const l of D().lanes)items.push({x:l.x,y:l.y,w:l.w,h:l.h});
    for(const g of D().groups)items.push({x:g.x,y:g.y,w:g.w,h:g.h});
    if(D().meta.title)items.push({x:0,y:0,w:D().canvas.width,h:90});
  }
  if(!items.length)return null;
  const minX=Math.min(...items.map(i=>i.x)),minY=Math.min(...items.map(i=>i.y));
  const maxX=Math.max(...items.map(i=>i.x+i.w)),maxY=Math.max(...items.map(i=>i.y+i.h));
  return {x:minX,y:minY,w:maxX-minX,h:maxY-minY};
}

/* Dispatch any opened/dropped file by kind: JSON diagram, SVG, or raster image.
   Images are imported INTACT (no graphics lost) as movable/resizable objects. */
function importFile(f,pos){
  if(!f)return;
  const name=(f.name||"").toLowerCase();
  const isJSON=f.type==="application/json"||name.endsWith(".json");
  const isSVG=f.type==="image/svg+xml"||name.endsWith(".svg");
  const isRaster=/^image\//.test(f.type)||/\.(png|jpe?g|gif|webp|bmp)$/.test(name);
  const rd=new FileReader();
  rd.onerror=()=>toast("Could not read "+(f.name||"file"),"error");
  if(isRaster&&!isSVG){
    rd.onload=()=>importRaster(rd.result,f.name,pos);
    rd.readAsDataURL(f);return;
  }
  // read as text for JSON / SVG (and sniff unknown types)
  rd.onload=()=>{
    const txt=String(rd.result||"");
    if(isJSON){loadJSONString(txt);return;}
    if(isSVG){importSVGText(txt,f.name,pos);return;}
    const t=txt.trimStart();
    if(t[0]==="{"){loadJSONString(txt);}
    else if(/^<\?xml|^<svg|<svg[\s>]/i.test(t)){importSVGText(txt,f.name,pos);}
    else toast("Unsupported file type: "+(f.name||""),"error");
  };
  rd.readAsText(f);
}
/* Import an SVG file: keep ALL original graphics (paths, defs, gradients, text)
   embedded intact, scaled into an editable node that you can move/resize/layer. */
function importSVGText(text,name,pos){
  let dom;
  try{dom=new DOMParser().parseFromString(text,"image/svg+xml");}catch(e){toast("Could not parse SVG","error");return false;}
  const root=dom.querySelector("svg");
  if(!root||dom.querySelector("parsererror")){toast("Invalid or corrupt SVG file","error");return false;}
  root.querySelectorAll("script,foreignObject script").forEach(s=>s.remove()); // safety only; graphics untouched
  let vb=root.getAttribute("viewBox");
  let w=parseFloat(root.getAttribute("width"))||0,hh=parseFloat(root.getAttribute("height"))||0;
  if(vb){const p=vb.split(/[\s,]+/).map(Number);if(p.length===4){if(!w)w=p[2];if(!hh)hh=p[3];}}
  if(!w)w=400;if(!hh)hh=300;
  if(!vb)vb="0 0 "+w+" "+hh;
  const maxDim=720,scale=Math.min(1,maxDim/Math.max(w,hh));
  const nw=Math.max(40,Math.round(w*scale)),nh=Math.max(40,Math.round(hh*scale));
  const c=pos||centerWorld();
  const n=makeNode("process",snap(c.x-nw/2),snap(c.y-nh/2));
  n.type="image";n.shape="image";n.title="";n.body="";n.icon="";n.shadow=false;
  n.accent={show:false,color:"#5c6b7e",width:5};n.badge={show:false,value:"",color:"#c92a2a"};
  n.w=nw;n.h=nh;n.fill="none";n.stroke="";n.strokeWidth=0;
  n.imageKind="svg";n.svgViewBox=vb;n.svgMarkup=root.innerHTML;n.naturalW=w;n.naturalH=hh;n.preserve="xMidYMid meet";
  D().nodes.push(n);select(n.id);commit();
  toast("Imported "+(name||"SVG")+" (intact)","success");return true;
}
/* Import a raster image as an editable object at its natural aspect ratio. */
function importRaster(dataUrl,name,pos){
  const img=new Image();
  img.onload=()=>{
    const w=img.naturalWidth||400,hh=img.naturalHeight||300;
    const maxDim=720,scale=Math.min(1,maxDim/Math.max(w,hh));
    const nw=Math.max(40,Math.round(w*scale)),nh=Math.max(40,Math.round(hh*scale));
    const c=pos||centerWorld();
    const n=makeNode("process",snap(c.x-nw/2),snap(c.y-nh/2));
    n.type="image";n.shape="image";n.title="";n.body="";n.icon="";n.shadow=false;
    n.accent={show:false,color:"#5c6b7e",width:5};n.badge={show:false,value:"",color:"#c92a2a"};
    n.w=nw;n.h=nh;n.fill="none";n.stroke="";n.strokeWidth=0;
    n.imageKind="raster";n.src=dataUrl;n.naturalW=w;n.naturalH=hh;n.preserve="xMidYMid meet";
    D().nodes.push(n);select(n.id);commit();
    toast("Imported "+(name||"image"),"success");
  };
  img.onerror=()=>toast("Could not load image "+(name||""),"error");
  img.src=dataUrl;
}
function loadJSONString(str){
  let data;try{data=JSON.parse(str);}catch(e){toast("Invalid JSON file","error");return false;}
  if(!data||typeof data!=="object"||!Array.isArray(data.nodes)){toast("Not a valid diagram file (missing nodes)","error");return false;}
  // normalise / fill defaults so partial files don't crash
  const base=blankDoc();
  STATE.doc={...base,...data,
    meta:{...base.meta,...(data.meta||{})},
    canvas:{...base.canvas,...(data.canvas||{}),grid:{...base.canvas.grid,...((data.canvas||{}).grid||{})}},
    lanes:data.lanes||[],groups:data.groups||[],nodes:data.nodes||[],edges:data.edges||[],
    legend:{...base.legend,...(data.legend||{})}};
  STATE.doc.nodes.forEach(n=>{n.badge=n.badge||{show:false,value:"",color:"#c92a2a"};n.accent=n.accent||{show:false,color:"#5c6b7e",width:5};});
  STATE.doc.edges.forEach(e=>{e.from=e.from||{nodeId:null,anchor:"auto"};e.to=e.to||{nodeId:null,anchor:"auto"};e.waypoints=e.waypoints||[];});
  STATE.sel.clear();applyTheme(STATE.doc.meta.theme||"light");$("#theme-select").value=STATE.doc.meta.theme||"light";
  resetHistory();fitToScreen();buildInspector();
  toast("Diagram loaded","success");return true;
}

/* ============================== EXPORT ============================= */
function buildExportSVG(selOnly,bgMode){
  const b=contentBBox(selOnly);if(!b){toast("Nothing to export","error");return null;}
  const margin=30;const W=b.w+margin*2,H=b.h+margin*2;
  const out=document.createElementNS(SVGNS,"svg");
  out.setAttribute("xmlns",SVGNS);out.setAttribute("width",W);out.setAttribute("height",H);
  out.setAttribute("viewBox",`${b.x-margin} ${b.y-margin} ${W} ${H}`);
  // font + style note
  const style=document.createElementNS(SVGNS,"style");
  style.textContent="text{font-family:'Inter',system-ui,sans-serif} .node-text{}";
  out.appendChild(style);
  // clone defs
  out.appendChild($("#defs").cloneNode(true));
  if(bgMode!=="transparent"){out.appendChild(svgEl("rect",{x:b.x-margin,y:b.y-margin,width:W,height:H,fill:theme().canvasBg}));}
  // clone the visible layers (grid optional)
  ["grid","lanes","groups","chrome","edges","nodes"].forEach(name=>{
    if(name==="grid")return; // skip live grid rect background to keep export clean (bg added above)
    const src=LAYERS[name];if(!src)return;
    let g=src.cloneNode(true);
    if(selOnly&&(name==="nodes"||name==="edges")){
      Array.from(g.children).forEach(ch=>{if(!STATE.sel.has(ch.getAttribute("data-id")))ch.remove();});
    }
    // remove selection rings/handles
    g.querySelectorAll('[stroke="#f5a623"]').forEach(e=>{if(e.getAttribute("stroke-dasharray"))e.remove();});
    out.appendChild(g);
  });
  return {svg:out,W,H,b,margin};
}
function serializeSVG(node){return '<?xml version="1.0" encoding="UTF-8"?>\n'+new XMLSerializer().serializeToString(node);}
function exportSVG(){
  const r=buildExportSVG(false,"white");if(!r)return;
  download((D().meta.title||"diagram").replace(/[^\w\-]+/g,"_")+".svg",serializeSVG(r.svg),"image/svg+xml");
  toast("SVG exported","success");
}
function doExportPNG(){
  const scale=parseFloat(document.querySelector('input[name=png-scale]:checked').value);
  const bg=document.querySelector('input[name=png-bg]:checked').value;
  const scope=document.querySelector('input[name=png-scope]:checked').value;
  $("#png-overlay").classList.remove("open");
  rasterize(scope==="sel",bg,scale,(blob)=>{
    download((D().meta.title||"diagram").replace(/[^\w\-]+/g,"_")+"@"+scale+"x.png",blob,"image/png");
    toast("PNG exported","success");
  });
}
function rasterize(selOnly,bg,scale,cb){
  const r=buildExportSVG(selOnly,bg);if(!r)return;
  const data=serializeSVG(r.svg);
  const img=new Image();
  const svgBlob=new Blob([data],{type:"image/svg+xml;charset=utf-8"});
  const url=URL.createObjectURL(svgBlob);
  img.onload=()=>{
    const canvas=document.createElement("canvas");canvas.width=Math.round(r.W*scale);canvas.height=Math.round(r.H*scale);
    const ctx=canvas.getContext("2d");
    if(bg!=="transparent"){ctx.fillStyle=theme().canvasBg;ctx.fillRect(0,0,canvas.width,canvas.height);}
    ctx.drawImage(img,0,0,canvas.width,canvas.height);
    URL.revokeObjectURL(url);
    canvas.toBlob(b=>cb(b,canvas),"image/png");
  };
  img.onerror=()=>{URL.revokeObjectURL(url);toast("PNG render failed","error");};
  img.src=url;
}
function copyImage(){
  if(!navigator.clipboard||!window.ClipboardItem){toast("Clipboard image not supported in this browser","error");return;}
  rasterize(false,"white",2,(blob)=>{
    navigator.clipboard.write([new ClipboardItem({"image/png":blob})]).then(()=>toast("Image copied to clipboard","success")).catch(()=>toast("Copy failed (permissions)","error"));
  });
}
function exportPDF(){
  const r=buildExportSVG(false,"white");if(!r)return;
  const area=$("#print-area");area.innerHTML="";area.appendChild(r.svg);
  r.svg.setAttribute("width","100%");r.svg.removeAttribute("height");
  toast("Use the print dialog → Save as PDF","info",3200);
  setTimeout(()=>window.print(),250);
}
/* ============================== CONTEXT MENU ====================== */
svg.addEventListener("contextmenu",ev=>{
  ev.preventDefault();
  const ng=ev.target.closest&&ev.target.closest(".node");
  const eg=ev.target.closest&&ev.target.closest(".edge");
  if(ng&&!STATE.sel.has(ng.dataset.id))select(ng.dataset.id);
  else if(eg&&!STATE.sel.has(eg.dataset.id))select(eg.dataset.id);
  const onObj=STATE.sel.size>0;
  const items=[];
  if(onObj){
    items.push(["Duplicate",duplicateSel],["Copy",copySel],["Cut",cutSel],["Delete",deleteSel],null,
      ["Bring to front",()=>zorder("front")],["Send to back",()=>zorder("back")],null,
      ["Group",groupSel],["Ungroup",ungroupSel]);
  }else{
    items.push(["Paste",paste],["Select all",()=>selectMany(D().nodes.map(n=>n.id))],null,
      ["Add process here",()=>addFromPalette("process",screenToWorld(ev.clientX,ev.clientY))],
      ["Add decision here",()=>addFromPalette("diamond",screenToWorld(ev.clientX,ev.clientY))],
      ["Fit to screen",fitToScreen]);
  }
  const cm=$("#ctxmenu");cm.innerHTML="";
  for(const it of items){if(!it){cm.appendChild(h('<div class="sep"></div>'));continue;}const b=h(`<button>${it[0]}</button>`);b.onclick=()=>{cm.style.display="none";it[1]();};cm.appendChild(b);}
  cm.style.left=ev.clientX+"px";cm.style.top=ev.clientY+"px";cm.style.display="block";
});

  {key:"integration-architecture",name:"Integration Architecture",desc:"Reference A — horizontal swimlane architecture (Workday → Oracle EBS AP)."},
  {key:"supplier-derivation",name:"Employee Supplier Derivation & Creation",desc:"Reference B — vertical decision flow with reject branches."},

function buildTemplatesUI(){
  const grid=$("#tpl-grid");grid.innerHTML="";
  grid.appendChild(h(`<div class="tpl-card" data-tpl="__blank"><h4>Blank canvas</h4><p>Start completely fresh.</p></div>`)).onclick=()=>{$("#tpl-overlay").classList.remove("open");newDiagram();};
  for(const t of TEMPLATE_META){
    const has=TEMPLATE_DATA[t.key];
    const card=h(`<div class="tpl-card" data-tpl="${t.key}"><h4>${t.name}</h4><p>${t.desc}${has?"":" (file in /templates)"}</p></div>`);
    card.onclick=()=>{if(TEMPLATE_DATA[t.key]){$("#tpl-overlay").classList.remove("open");loadDoc(TEMPLATE_DATA[t.key]);}else toast("Open this template from the templates/ folder","info");};
    grid.appendChild(card);
  }
}
function loadDoc(doc){loadJSONString(JSON.stringify(doc));}
// expose templates via File ▸ New menu (the New button offers template choice)
ACTIONS["new"]=()=>{buildTemplatesUI();$("#tpl-overlay").classList.add("open");};
